# ── l7v/nixos ──
# SOPS age key routing
# Yeni host için age key üretmek: ./scripts/bootstrap.sh HOSTNAME
# Üretilen public key'i buraya ekle, ardından:
#   sops updatekeys secrets/sops/secrets.yaml
keys:
  - &L7V age12q2vq6qnhct3hezcpspjzsaapf4k9u0zklugea3m2ktt69gwyg5qncl0lx
  - &life7vision_laptop age100fgm3zj79kwsw962f9ehw8s43llfk7z2tpsh2juy3platc99qcs7lj0yw
  # TODO: aşağıdaki key'ler ilgili host'lar kurulunca bootstrap.sh ile üretilip doldurulacak
  - &server  age_TODO_server_public_key_replace_after_bootstrap
  - &builder age_TODO_builder_public_key_replace_after_bootstrap
  - &backup  age_TODO_backup_public_key_replace_after_bootstrap

creation_rules:
  # Laptop'tan okunabilir tüm secret'lar
  - path_regex: secrets/sops/.*\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *L7V
          - *life7vision_laptop
          - *server
          - *builder
          - *backup

  # Sadece server'ın okuyabileceği secret'lar (ileride ayrı dosyaya taşınabilir)
  # - path_regex: secrets/sops/server/.*
  #   key_groups:
  #     - age:
  #         - *life7vision_laptop
  #         - *server
