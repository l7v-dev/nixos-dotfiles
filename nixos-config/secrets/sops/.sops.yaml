# SOPS age key routing for the l7v NixOS platform.
#
# Adding a new host:
#   1. Run `./scripts/bootstrap.sh <HOSTNAME>` on the target machine.
#   2. Copy the printed public key into the keys section below.
#   3. Run `sops updatekeys secrets/sops/secrets.yaml` from the repo root.
#
# WARNING: Keys marked TODO are placeholder strings. Running `sops updatekeys`
# while a TODO key is present will fail with an invalid recipient error.
# Replace each TODO key before re-encrypting, or comment out the reference
# in creation_rules until the host is provisioned.
keys:
  - &L7V age12q2vq6qnhct3hezcpspjzsaapf4k9u0zklugea3m2ktt69gwyg5qncl0lx
  - &life7vision_laptop age100fgm3zj79kwsw962f9ehw8s43llfk7z2tpsh2juy3platc99qcs7lj0yw
  # Replace the values below with real keys produced by bootstrap.sh,
  # then run: sops updatekeys secrets/sops/secrets.yaml
  - &server  age_TODO_server_public_key_replace_after_bootstrap
  - &builder age_TODO_builder_public_key_replace_after_bootstrap
  - &backup  age_TODO_backup_public_key_replace_after_bootstrap

creation_rules:
  # All secrets readable by the laptop and any provisioned server.
  # Comment out TODO key references (e.g. *server) until the host is bootstrapped.
  - path_regex: secrets/sops/.*\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *L7V
          - *life7vision_laptop
          # Uncomment each line after running bootstrap.sh on the corresponding host:
          # - *server
          # - *builder
          # - *backup

  # Server-only secrets (e.g. production DB passwords) — create a separate file
  # and scope it here once the server key is provisioned:
  # - path_regex: secrets/sops/server/.*
  #   key_groups:
  #     - age:
  #         - *life7vision_laptop
  #         - *server
